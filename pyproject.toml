[project]
name = "anomaly-detection-from-scratch"
version = "0.1.0"
description = "Implementing anomaly detection algorithms from scratch"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "faiss-cpu>=1.14.3",
    "omegaconf>=2.3.1",
    "mlflow>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
